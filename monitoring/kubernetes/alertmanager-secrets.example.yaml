apiVersion: v1
kind: Secret
metadata:
  name: roam-rewards-alertmanager-webhooks
  namespace: monitoring
type: Opaque
stringData:
  # Replace these placeholders out-of-band; do not commit real URLs.
  incident_webhook_url: https://incident-relay.example.invalid/alertmanager
  chat_webhook_url: https://chat-relay.example.invalid/alertmanager
---
# Mount keys as files at the paths referenced by monitoring/alertmanager.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  template:
    spec:
      containers:
        - name: alertmanager
          volumeMounts:
            - name: webhook-secrets
              mountPath: /etc/alertmanager/secrets
              readOnly: true
      volumes:
        - name: webhook-secrets
          secret:
            secretName: roam-rewards-alertmanager-webhooks
