name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Nothing validated this file before; broken YAML slipped into main
      # unnoticed. PyYAML ships preinstalled on ubuntu runners.
      - name: Validate Compose file
        run: python3 -c "import yaml; yaml.safe_load(open('docker-compose.runtime.example.yml'))"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The Redis integration tests spawn their own redis-server binary on a
      # free port, so the binary (not a service container) is what CI needs.
      - name: Install Redis server
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The runtime image is what serves production, but nothing built it in
      # CI before. Build-only (no push); it needs no secrets at build time.
      - name: Build runtime image
        run: docker build --file Dockerfile.runtime --tag roam-rewards-server:ci .

      - name: Redis integration tests
        run: pnpm test:redis
